[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    smoke: Quick smoke tests
    regression: Full regression suite
    critical: Critical test cases
    skip: Tests to be skipped
    slow: Slow running tests
    autosys: Autosys portal tests
    database: Database validation tests
    ui: UI validation tests
    parametrize: Parameterized tests

# Command line options
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --capture=no
    --maxfail=5

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/logs/test_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution
# Use with: pytest -n auto or pytest -n 4
